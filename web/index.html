<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <script>
      // The saved theme before the first paint, so a dark choice never flashes light; light on a first visit, even
      // when the system is dark. src/theme.ts keeps the same key and these colours (the page colour of each theme),
      // and takes over once the page loads.
      (function () {
        var colors = { light: "#f7f4ef", dark: "#14110f" };
        var theme = "light";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark" || stored === "system") theme = stored;
        } catch (error) {
          // Storage is blocked: light.
        }
        document.documentElement.dataset.theme = theme;
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? colors.dark : colors.light);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lantern</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
